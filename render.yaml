services:
  # Option 1: FastAPI Web Application & API (Default UI)
  - type: web
    name: glycoguard-ai-app
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python -m src.train
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

